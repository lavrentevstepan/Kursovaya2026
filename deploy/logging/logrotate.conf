/var/log/securekb/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    dateext
    dateformat -%Y%m%d
    create 0640 skb_svc skb_group
    postrotate
        /bin/kill -HUP `cat /var/run/securekb/securekb.pid 2>/dev/null` 2>/dev/null || true
    endscript
}
